function backupExpenseRuntime(){const blob=new Blob([JSON.stringify({version:1,trip:key,expenses:runtime()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='travel-expenses-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}function restoreExpenseRuntime(file){const reader=new FileReader();reader.onload=()=>{try{const backup=JSON.parse(reader.result);if(!Array.isArray(backup.expenses))throw Error();localStorage.setItem(key,JSON.stringify(backup.expenses));renderExpenses();}catch{alert('這不是有效的記帳備份檔。')}};reader.readAsText(file);}const baseRenderExpenses=renderExpenses;renderExpenses=function(){baseRenderExpenses();const actions=document.createElement('div');actions.className='card';actions.innerHTML=`<b>備份手機記帳</b><p class=muted>記帳資料只在這台手機保存；換手機前請先匯出。</p><button id=expense-backup>匯出備份</button> <label class=secondary style='display:inline-block;padding:9px 12px;border-radius:9px;border:1px solid #d7b99f;color:#b54a14'>匯入備份<input id=expense-restore type=file accept='application/json' hidden></label>`;$('#expenses').append(actions);$('#expense-backup').onclick=backupExpenseRuntime;$('#expense-restore').onchange=e=>{if(e.target.files[0])restoreExpenseRuntime(e.target.files[0]);};};
